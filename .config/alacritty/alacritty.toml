# Window configuration
[window]
dimensions = { columns = 140, lines = 40 }
padding = { x = 8, y = 8 }
dynamic_padding = true
decorations = "Transparent"                # Removes the title bar for a cleaner look
opacity = 0.95                             # Slightly adjusted for better readability
startup_mode = "Maximized"                 # Starts maximized
title = "Alacritty"
dynamic_title = true

# Font configuration
[font]
normal = { family = "Hack Nerd Font Mono", style = "Regular" }
bold = { family = "Hack Nerd Font Mono", style = "Bold" }
italic = { family = "Hack Nerd Font Mono", style = "Italic" }
bold_italic = { family = "Hack Nerd Font Mono", style = "Bold Italic" }
size = 20.0
# Add subtle offset for better readability
offset = { x = 1, y = 3 }
# Adjust glyph offset for better rendering
glyph_offset = { x = 0, y = 3 }

[scrolling]
history = 10000
multiplier = 3

# Enhanced color scheme (Tokyo Night inspired)
[colors.primary]
background = "#1a1b26"
foreground = "#c0caf5"

[colors.normal]
black = "#15161e"
red = "#f7768e"
green = "#9ece6a"
yellow = "#e0af68"
blue = "#7aa2f7"
magenta = "#bb9af7"
cyan = "#7dcfff"
white = "#a9b1d6"

# Added bright colors for better contrast in some situations
[colors.bright]
black = "#414868"
red = "#ff7a93"
green = "#b9f27c"
yellow = "#ff9e64"
blue = "#7da6ff"
magenta = "#bb9af7"
cyan = "#7dcfff"
white = "#c0caf5"

# Added selection colors
[colors.selection]
text = "CellForeground"
background = "#364A82"

# Cursor improvements
[cursor]
style = { shape = "Beam", blinking = "On" } # Changed to Beam for modern look
blink_interval = 750
blink_timeout = 5
thickness = 0.15
unfocused_hollow = true

# Enhanced keyboard bindings
[[keyboard.bindings]]
key = "V"
mods = "Control|Shift"
action = "Paste"

[[keyboard.bindings]]
key = "C"
mods = "Control|Shift"
action = "Copy"

[[keyboard.bindings]]
key = "N"
mods = "Control|Shift"
action = "CreateNewWindow"

[[keyboard.bindings]]
key = "F11"
action = "ToggleFullscreen"

[[keyboard.bindings]]
key = "Equals"
mods = "Control"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "Minus"
mods = "Control"
action = "DecreaseFontSize"

[[keyboard.bindings]]
key = "Key0"
mods = "Control"
action = "ResetFontSize"

[env]
TERM = "xterm-256color"

[selection]
save_to_clipboard = true
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"

# Mouse configuration
[mouse]
hide_when_typing = true

# Better window class name for window managers
[window.class]
general = "Alacritty"
instance = "Alacritty"

# Window hints
[hints]
alphabet = "jfkdls;ahgurieowpq"

[terminal]
shell.program = '/opt/homebrew/bin/herdr'
